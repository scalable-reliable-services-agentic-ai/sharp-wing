
<!DOCTYPE html>
<html>
<head>
    <title>Generator Control</title>
    <style>
        body { font-family: sans-serif; } form { max-width: 500px; } label { display: block; margin-bottom: 10px; } input { width: 100%; }
    </style>
</head>
<body>
    <h1>Generator Control</h1>
    <p><a href="{{ url_for('main') }}">Back to Main Panel</a></p>
    <hr>
    <form method="POST">
        <label for="tps">Average Transactions per Second (current: {{ current_tps }})
            <input type="range" id="tps" name="tps" min="1" max="50" value="{{ current_tps }}" oninput="this.nextElementSibling.value = this.value">
            <output>{{ current_tps }}</output>
        </label>
        <br>
        <label for="invalid_percentage">Invalid Transaction Percentage (current: {{ current_invalid_perc }}%)
            <input type="range" id="invalid_percentage" name="invalid_percentage" min="0" max="100" value="{{ current_invalid_perc }}" oninput="this.nextElementSibling.value = this.value">
            <output>{{ current_invalid_perc }}</output>%
        </label>
        <br><br>
        <button type="submit">Update Settings</button>
    </form>
</body>
</html>
