apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: http
    - port: 9093
      targetPort: 9093
      protocol: TCP
      name: controller
