global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'validator'
    static_configs:
      - targets: ['validator:8001']

  - job_name: 'anomaly-detection'
    static_configs:
      - targets: ['anomaly-detection:8002']

  - job_name: 'fraud-triage'
    static_configs:
      - targets: ['fraud-triage:8003']

  - job_name: 'batch-ingestor'
    static_configs:
      - targets: ['batch-ingestor:8004']
